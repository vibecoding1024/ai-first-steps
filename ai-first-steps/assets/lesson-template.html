<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · AI 入门小课</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f6ed;
      --card: #fffffa;
      --ink: #192c27;
      --muted: #4d6258;
      --line: #d9dfd2;
      --green: #203e34;
      --lime: #e1efaa;
      --mint: #e5f1e7;
      --peach: #ffe8d7;
      --serif: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.8 var(--sans); }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2 { font-family: var(--serif); font-weight: 800; }
    a { color: inherit; text-underline-offset: .24em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    [id] { scroll-margin-top: 1.25rem; }

    .wrap { width: min(100% - 3rem, 72rem); margin-inline: auto; }
    .site-head {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: .6rem 1.2rem;
      padding-block: 1.05rem; border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: .6rem; font-weight: 750; text-decoration: none; }
    .brand-mark {
      display: grid; place-items: center; width: 2rem; height: 2rem;
      border-radius: .5rem; background: var(--green); color: var(--lime); font-size: .72rem;
    }
    .nav { display: flex; flex-wrap: wrap; gap: .25rem 1.3rem; font-size: .91rem; color: var(--muted); }
    .nav a { text-decoration-color: transparent; }
    .nav a:hover { text-decoration-color: currentColor; }

    .hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 2rem; align-items: center; padding-block: 3.25rem; }
    .hero:has(.hero-copy:only-child) { grid-template-columns: minmax(0, 1fr); }
    h1 { font-size: clamp(2.15rem, 5.1vw, 4.55rem); line-height: 1.15; letter-spacing: -.045em; overflow-wrap: anywhere; }
    h1 mark { color: inherit; background: linear-gradient(transparent 67%, var(--lime) 67% 96%, transparent 96%); }
    .hero-copy p { max-width: 33rem; margin-top: 1.3rem; font-size: clamp(1rem, 1.55vw, 1.18rem); color: var(--muted); text-wrap: pretty; }
    .hero-art {
      display: grid; place-items: center; min-height: 18rem; overflow: hidden; border-radius: 1.35rem;
      background-color: var(--green); background-image: radial-gradient(#668477 1px, transparent 1px);
      background-size: 1.25rem 1.25rem;
    }
    .art-board { display: grid; place-items: center; position: relative; width: min(100%, 27rem); height: 18rem; }
    .art-board::before, .art-board::after {
      content: ""; position: absolute; width: 65%; height: 57%; border: 1px dashed #9ab6a5;
      border-radius: 50%; transform: rotate(-19deg);
    }
    .art-board::after { transform: rotate(22deg); }
    .art-center, .art-label { position: absolute; z-index: 1; box-shadow: 0 .45rem 0 #102b2375; }
    .art-center {
      display: grid; place-items: center; background: var(--lime); color: var(--ink);
      width: 7.1rem; height: 5.5rem; border-radius: 1.15rem; transform: rotate(-8deg);
      font: 800 3rem/1 var(--sans);
    }
    .art-label { border-radius: .58rem; padding: .3rem .72rem; color: var(--ink); font-size: 1rem; font-weight: 750; }
    .art-left { left: 8%; top: 21%; background: var(--peach); transform: rotate(-9deg); }
    .art-right { right: 7%; top: 23%; background: var(--mint); transform: rotate(9deg); }
    .art-bottom { right: 14%; bottom: 18%; background: var(--card); transform: rotate(-6deg); }

    .section-title { margin-bottom: 1.1rem; font-size: clamp(1.65rem, 3.25vw, 2.35rem); line-height: 1.25; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
    .card {
      --accent: var(--mint);
      min-width: 0; padding: clamp(1.2rem, 2.4vw, 1.75rem); border: 1px solid var(--line);
      border-radius: 1.2rem; background: var(--card);
    }
    .card.peach { --accent: var(--peach); }
    .card.lime { --accent: var(--lime); }
    .concept-icon {
      display: grid; place-items: center; width: 2.65rem; height: 2.65rem;
      border-radius: .65rem; background: var(--accent); font: 750 1.25rem/1 var(--sans);
    }
    .card h3 { margin-top: .85rem; font-size: 1.48rem; line-height: 1.3; overflow-wrap: anywhere; }
    .term { margin-top: .25rem; color: var(--muted); font-size: .81rem; overflow-wrap: anywhere; }
    .definition { margin-top: .85rem; font-weight: 700; }
    .example { margin-top: .95rem; padding-top: .95rem; border-top: 1px solid var(--line); color: var(--muted); }
    .example strong { color: var(--ink); }

    .scenario, .practice { margin-top: 2.5rem; padding: clamp(1.25rem, 3.4vw, 2.5rem); border-radius: 1.2rem; }
    .scenario { background: var(--green); color: #f6fbf3; }
    .scenario .section-title { color: var(--lime); }
    .scenario blockquote { margin: 0; font-size: 1.12rem; }
    .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: .75rem; margin: 1.2rem 0 0; }
    .roles > div { border: 1px solid #749387; border-radius: .75rem; padding: .9rem 1rem; }
    .roles dt { font-weight: 750; color: var(--lime); }
    .roles dd { margin: .2rem 0 0; }
    .scenario-note { margin-top: 1rem; color: #e1eee6; font-size: .9rem; }

    .practice { background: var(--peach); }
    details { margin-top: .9rem; }
    summary { cursor: pointer; font-weight: 750; }
    details > p { margin-top: .55rem; }
    .answer {
      display: inline-block; max-width: 100%; padding: .45rem .85rem;
      border: 1px solid #936b51; border-radius: .65rem; background: #fff7ed;
    }

    .answer-icon::after { content: "+"; margin-left: .55em; }
    details[open] .answer-icon::after { content: "−"; }

    .site-foot {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem 1.25rem;
      margin-top: 2.5rem; padding-block: 1.2rem 1.7rem; border-top: 1px solid var(--line);
      font-size: .85rem; color: var(--muted);
    }
    .source-links { display: flex; flex-wrap: wrap; gap: .2rem .9rem; margin: 0; padding: 0; list-style: none; }

    @media (max-width: 760px) {
      .wrap { width: calc(100% - 2rem); }
      .hero { grid-template-columns: 1fr; gap: 1.35rem; padding-block: 2rem; }
      .hero-art { min-height: 13rem; }
      .art-board { height: 13rem; }
      .art-center { width: 5.3rem; height: 4rem; font-size: 2.2rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      body { background: white; }
      .wrap { width: 100%; }
      .hero { display: block; padding-block: 1rem; }
      .hero-art, .nav, .back-top { display: none; }
      .cards { grid-template-columns: 1fr; }
      .card, .scenario, .practice { break-inside: avoid; }
      .scenario { background: white; color: var(--ink); border: 1px solid var(--line); }
      .scenario .section-title, .roles dt, .scenario-note { color: var(--ink); }
    }
  </style>
</head>
